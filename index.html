<title>주택 관련 법령 모니터링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 한 줄 세로 흐름 — 로고·가운데 제목·오른쪽 날짜 → 구분별 건수(겸 필터) → 기간·검색 → 날짜별 목록(최신이 위) */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --line:#DCE1E9; --fg:#14173A; --fg2:#565C78; --fg3:#8A90A8;
  --accent:#1B1F5E;
  --c1:#1680C9; --c1-bg:#E3F0FA;
  --c2:#2E9A48; --c2-bg:#E4F4E8;
  --c3:#D8414B; --c3-bg:#FBE6E7;
  --today:#FFF6D6; --today-line:#F1D36B;
  --f-display:"Gowun Batang", "Batang", serif;
  --f-date:"Gowun Batang", "Batang", serif;
  --f-body:"IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10122A; --surface:#181B38; --line:#2B2F55; --fg:#E7E9F5; --fg2:#A8ADC8; --fg3:#737896;
  --accent:#C9CCF4;
  --c1:#5DB2EC; --c1-bg:#15304A; --c2:#6BCB82; --c2-bg:#16362A; --c3:#F0797F; --c3-bg:#3E1C27;
  --today:#2E2A18; --today-line:#8C7630; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10122A; --surface:#181B38; --line:#2B2F55; --fg:#E7E9F5; --fg2:#A8ADC8; --fg3:#737896;
  --accent:#C9CCF4;
  --c1:#5DB2EC; --c1-bg:#15304A; --c2:#6BCB82; --c2-bg:#16362A; --c3:#F0797F; --c3-bg:#3E1C27;
  --today:#2E2A18; --today-line:#8C7630; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 56px;display:flex;flex-direction:column;gap:28px}

header{display:flex;flex-direction:column;gap:10px}
.logo{height:24px;width:auto;align-self:flex-start;background:#FFFFFF;border-radius:4px;padding:3px 6px;box-sizing:content-box}
h1{margin:6px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7.5vw,44px);line-height:1.2;color:var(--accent);text-align:center;text-wrap:balance;letter-spacing:-.01em}
.date{align-self:flex-end;font-family:var(--f-date);font-weight:400;font-size:clamp(14px,3.4vw,16px);color:var(--fg2)}

.counts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.counts .sep{display:none}
.cnt{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit;font-size:14.5px;white-space:nowrap;display:inline-flex;align-items:baseline;gap:8px;box-shadow:0 1px 2px rgba(20,23,58,.06);transition:background .15s,border-color .15s}
.cnt b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.cnt[data-ch="1"] b{color:var(--c1)} .cnt[data-ch="2"] b{color:var(--c2)} .cnt[data-ch="3"] b{color:var(--c3)}
.cnt:hover{border-color:var(--fg3)}
.cnt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.cnt[aria-pressed="true"] b{color:var(--bg)}
.cnt:focus-visible,.seg button:focus-visible,.item summary:focus-visible,input:focus-visible{outline:2px solid var(--c1);outline-offset:2px}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--fg2);font:inherit;font-size:14px;padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:600}
.search{flex:1 1 200px;min-width:0}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--fg3)}

.days{display:flex;flex-direction:column;gap:22px}
.day{display:flex;flex-direction:column;gap:8px}
.day h2{margin:0;font-size:14px;font-weight:600;color:var(--fg2);display:flex;align-items:baseline;gap:8px}
.day h2 .d{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);font-size:15px}
.day h2 .tag{font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--today-line);background:var(--today);border-radius:999px;padding:0 8px}
.note{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;color:var(--fg2);font-size:14px;background:var(--surface)}
.day.is-today .note{border-style:solid;border-color:var(--today-line);background:var(--today);color:var(--fg)}

.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.item summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.item summary::-webkit-details-marker{display:none}
.badge{font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;white-space:nowrap;margin-top:2px}
.badge.c1{color:var(--c1);background:var(--c1-bg)} .badge.c2{color:var(--c2);background:var(--c2-bg)} .badge.c3{color:var(--c3);background:var(--c3-bg)}
.item .t{font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.item .m{grid-column:2 / 4;font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.chev{color:var(--fg3);font-size:13px;margin-top:2px;transition:transform .15s}
.item[open] .chev{transform:rotate(180deg)}
.body{padding:0 14px 14px;margin-left:0;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-inline:14px;padding-inline:0}
.body ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.body li{overflow-wrap:anywhere}
.body a{color:var(--c1);font-size:13.5px;font-weight:500;text-decoration:none;align-self:flex-start}
.body a:hover{text-decoration:underline}
mark{background:var(--today);color:inherit;border-radius:2px}
.new{display:inline-block;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--today);border:1px solid var(--today-line);border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:2px;white-space:nowrap}
footer{font-size:13px;color:var(--fg2);text-align:right}

@media (max-width:560px){
  .seg{width:100%} .seg button{flex:1}
}
@media (prefers-reduced-motion:reduce){ .chev,.cnt{transition:none} }
</style>

<script>
(function(){
  var CH = {1:'법령 개정', 2:'입법·행정예고', 3:'의원입법 발의'};
  var DOW = ['일','월','화','수','목','금','토'];
  var state = {days:10, ch:0, q:''};
  var data = null;

  function pad(n){ return (n<10?'0':'')+n; }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function label(s){ var d=parse(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일('+DOW[d.getDay()]+')'; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function hi(s){
    var t = esc(s); if(!state.q) return t;
    var q = esc(state.q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return t.replace(new RegExp(q,'gi'), function(m){ return '<mark>'+m+'</mark>'; });
  }

  var now = new Date(), today = ymd(now);
  document.getElementById('today').textContent = now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+DOW[now.getDay()]+'요일';

  // 원래 날짜(공포일·게시일·예고 시작일·제안일)로 묶는다. 없거나 미래 날짜면 보고일로.
  function day(it){ var d = it.orig_date || it.date; return d > today ? it.date : d; }

  function todayStatus(){
    if (data.last_checked === today){
      var added = data.items.filter(function(it){ return it.date===today && day(it)!==today; }).length;
      return added ? '금일 해당사항 없음 · 오늘 새로 확인된 '+added+'건은 아래 원래 날짜에 표시했습니다.' : '금일 해당사항 없음';
    }
    var dow = now.getDay();
    if (dow===0 || dow===6 || (data.holidays||[]).indexOf(today)>=0) return '오늘은 휴무일이라 확인하지 않습니다.';
    return '아직 오늘 확인 전입니다. 매일 오전 9시 30분쯤 갱신됩니다.';
  }

  function match(it){
    if (!state.q) return true;
    var q = state.q.toLowerCase();
    return (it.title+' '+it.meta+' '+it.points.join(' ')).toLowerCase().indexOf(q) >= 0;
  }

  function render(){
    var cut = new Date(now.getFullYear(), now.getMonth(), now.getDate()-(state.days-1));
    var cutS = ymd(cut);
    var inRange = data.items.filter(function(it){ var d = day(it); return d >= cutS && d <= today && match(it); });

    var n = {0:inRange.length,1:0,2:0,3:0};
    inRange.forEach(function(it){ n[it.chapter]++; });
    [0,1,2,3].forEach(function(c){
      var b = document.getElementById('cnt-'+c);
      b.querySelector('b').textContent = n[c]+'건';
      b.setAttribute('aria-pressed', String(state.ch===c));
    });
    [10,20,40].forEach(function(d){ document.getElementById('p-'+d).setAttribute('aria-pressed', String(state.days===d)); });

    var shown = inRange.filter(function(it){ return !state.ch || it.chapter===state.ch; });
    var groups = {};
    shown.forEach(function(it){ var d = day(it); (groups[d]=groups[d]||[]).push(it); });
    var dates = Object.keys(groups).filter(function(d){ return d!==today; }).sort().reverse();

    var html = dayHtml(today, groups[today]||[], true);
    dates.forEach(function(d){ html += dayHtml(d, groups[d], false); });
    if (!dates.length && (state.q || state.ch)) html += '<div class="note">선택한 기간과 조건에 맞는 지난 항목이 없습니다.</div>';
    document.getElementById('days').innerHTML = html;
  }

  function dayHtml(d, list, isToday){
    var h = '<section class="day'+(isToday?' is-today':'')+'"><h2><span class="d">'+label(d)+'</span>'+(isToday?'<span class="tag">오늘</span>':'')+'</h2>';
    if (!list.length){
      var msg = todayStatus();
      if (data.last_checked === today && (state.q || state.ch) && data.items.some(function(it){return day(it)===today;})) msg = '선택한 조건에 맞는 오늘 항목이 없습니다.';
      h += '<div class="note">'+esc(msg)+'</div>';
    }
    list.sort(function(a,b){ return a.chapter-b.chapter; }).forEach(function(it){
      h += '<details class="item"><summary><span class="badge c'+it.chapter+'">'+CH[it.chapter]+'</span>'
        + '<span class="t">'+hi(it.title)+(it.date===today && !isToday ? ' <span class="new">오늘 확인</span>' : '')+'</span><span class="chev" aria-hidden="true">▾</span>'
        + '<span class="m">'+hi(it.meta)+'</span></summary><div class="body"><ul>'
        + it.points.map(function(p){ return '<li>'+hi(p)+'</li>'; }).join('')
        + '</ul>'+(it.url?'<a href="'+esc(it.url)+'" target="_blank" rel="noopener">원문 보기 ↗</a>':'')+'</div></details>';
    });
    return h + '</section>';
  }

  document.getElementById('counts').addEventListener('click', function(e){
    var b = e.target.closest('.cnt'); if(!b) return;
    var c = +b.getAttribute('data-ch'); state.ch = (state.ch===c ? 0 : c); render();
  });
  document.querySelector('.seg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.days = +b.getAttribute('data-days'); render();
  });
  document.getElementById('q').addEventListener('input', function(e){ state.q = e.target.value.trim(); render(); });

  fetch('data.json', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error(r.status); return r.json();
  }).then(function(j){
    data = j;
    render();
  }).catch(function(){
    document.getElementById('days').innerHTML = '<div class="note">자료를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
  });
})();
</script>

</html>
